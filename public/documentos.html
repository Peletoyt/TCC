<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão</title>
    <link href="style/style.css" rel="stylesheet">
    <link href="style/documentos.css" rel="stylesheet">
</head>

<body class="gestao">

    <div id="sidebar-placeholder"></div>

    <main>
        <div class="p-4">
            <div>
                <h2 class="mb-4">Organizar Documentos</h2>
                Aqui você pode visualizar os documentos que você enviou ou que foram enviados a você
            </div>
            <hr>
            <div>
            </div>
            <div class="container-doc">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider">
                        <span class="doc active">Documentos Enviados</span>
                        <span class="atest">Atestados Recebidos</span>
                    </span>
                </label>
                <hr>
                <form class="container-src input-group" action="/pesquisa" method="get">
                    <input class="search form-control" type="search" name="search" placeholder="Faça sua busca">
                    <button type="submit" class="btn btn-success">Buscar</button>
                </form>
                <button class="addDocument bg-success text-white">+ Enviar Documento</button>
                <section>
                    <div class="documento">
                        
                        <div class="doc-icon">
                            <img src="icons/pdf-icon.png">
                        </div>
                        
                        <div>
                            <h3>Acidente nas Torres Gêmeas</h3>
                            <h6>11/09/2001 • Enviado para: Celso Portiolli</h6>
                            <p>anexo documento</p>
                        </div>
                        
                        <button type="button" class="btn btn-secondary" data-bs-container="body"
                        data-bs-toggle="popover" data-bs-placement="left" data-bs-content="Left popover">
                        <img src="icons/options.png">
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="js/script.js" defer></script>
</body>

</html>
