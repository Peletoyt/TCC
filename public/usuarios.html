<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Funcionário</title>
  <link href="style/style.css" rel="stylesheet" />
</head>

<body>
  <div id="sidebar-placeholder"></div>

  <main id="main-content">
    <form class="container usuario" id="user-form">
      <div class="d-grid gap-2">
        <h1 class="text-center">Adicione as credenciais necessarias</h1>

        <!--Input foto-->
        <div>
          <label>Foto:</label><br />
          <button type="button" id="btnFoto" class="btn btn-dark btnFoto w-100" onclick="abrirModalFoto()">
            + Adicionar Foto
          </button>
        </div>

        <div>
          <!--Input do nome-->
          <label>Nome:</label>
          <input type="text" id="nome-user" placeholder="Escreva o nome completo" required
            class="border p-2 form-control" />
        </div>

        <!--Input do email-->
        <div>
          <label>E-mail:</label>
          <input type="text" id="nome-email" placeholder="Escreva o E-mail" required class="border p-2 form-control" />
        </div>

        <!--Input escopo-->
        <div>
          <label>Escopo:</label>
          <select class="form-select form-select-sm" aria-label=".form-select-sm example" id="escopo-user">
            <option value="funcionario" selected>Funcionário</option>
            <option value="admin">Gestor</option>
          </select>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-success">Enviar</button>
          <button type="reset" class="btn btn-danger">Cancelar</button>
        </div>
      </div>
    </form>

    <form class="container usuario">
      <h1 class="text-center">Veja e edite credenciais existentes</h1>
      <!-- Fazer uma tabela que leia os usuarios existentes -->
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Foto</th>
            <th scope="col">Nome</th>
            <th scope="col">E-mail</th>
            <th scope="col">Escopo</th>
            <th scope="col">data de criação</th>
          </tr>

          <!--Exemplo de linha de usuário, deve ser gerada dinamicamente a partir dos dados do banco de dados -->
          <!-- Gerado automaricamente desta maneira sendo o row == id -->
        </thead>
        <tbody id="tabela-usuarios">
          <!-- Aqui serão inseridos os usuários dinamicamente e automaticamente-->
        </tbody>
      </table>


    </form>
  </main>
  <script src="js/modal.js" defer></script>
  <script src="js/script.js" defer></script>
  <script>
    const userForm = document.getElementById('user-form');

    userForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if(!fotoBlob) {
        alert("Por favor, capture uma foto antes de enviar o formulário.");
        return;
      }

      const formData = new FormData();

      formData.append('nome', document.getElementById('nome-user').value);
      formData.append('email', document.getElementById('nome-email').value);
      formData.append('usuariocol', document.getElementById('escopo-user').value);
      formData.append('foto', fotoBlob, `foto-${Date.now()}.jpg`);

      try {
        const response = await fetch('/api/usuarios', {
          method: 'POST',
          body: formData,
        });

        const result = await response.json();
        if (response.ok) {
          alert('Usuário adicionado com sucesso!');
          userForm.reset();
          fotoBlob = null; // Limpa a foto capturada

        }}
         catch (error) {
        console.error('Erro ao enviar o formulário:', error);
        alert(`Ocorreu um erro ao enviar o formulário. Por favor, tente novamente. ${error.message}`);
      }
    });

  </script>
</body>

</html>
